<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>归迟录</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a2a30,#0b0b0e)}
#app{position:relative;height:96vh;aspect-ratio:9/16;max-width:96vw;overflow:hidden;border:6px solid #3a3a42;border-radius:22px;box-shadow:0 0 0 2px #000,0 10px 40px #000c}
#app canvas{display:block;width:100%!important;height:100%!important}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f4ecd8;pointer-events:none}
.ui h1{font-size:9vh;letter-spacing:.2em;text-shadow:0 0 12px #000;margin:0 0 6vh}
button{pointer-events:auto;font-size:3vh;padding:1.5vh 5vh;border:1px solid #e8d7a8;background:#2a3b4acc;color:#f4ecd8;border-radius:8px;font-family:inherit}
.hud{justify-content:flex-start;padding-top:3vh}#hudText{font-size:3.2vh;background:#000a;padding:.8vh 2.4vh;border-radius:6px}.hud button{margin-top:auto!important;margin-bottom:5vh}.hidden{display:none}#dialog{position:absolute;left:3%;right:3%;bottom:16.67%;z-index:18;background:#1a1612e6;color:#f4ecd8;border:1px solid #e8d7a8;border-radius:10px;padding:2vh;font-size:2.6vh;cursor:pointer}#dialog .speaker{color:#e8c27a;font-weight:bold;margin-bottom:1vh}#dialog .hint{text-align:right;opacity:.6;font-size:2vh}#dialog button{display:block;width:100%;margin-top:1.2vh}.row{margin-top:auto;margin-bottom:5vh;display:flex;flex-direction:column;gap:1.5vh}.row button{margin:0!important}#battleLog{margin-top:2vh;font-size:2.4vh;background:#000a;padding:.8vh 2vh;border-radius:6px;max-width:90%}#mapBtn{position:absolute;top:2.4vh;right:2.4vh;font-size:2.2vh;padding:.8vh 2vh;z-index:5}
#map{position:absolute;inset:0;z-index:20;background:#2d3e48 url(/W0/ui/UI_MAP_CH1.png) center/cover no-repeat;color:#f4ecd8;display:flex;flex-direction:column;align-items:center;padding:3vh 2vh;box-sizing:border-box}#map.hidden{display:none!important}
#map h2{margin:0;letter-spacing:.2em}#mapObj{font-size:2.2vh;opacity:.85;margin:1vh 0 2vh}
#mapNodes{flex:1;display:flex;flex-direction:column-reverse;justify-content:space-around;width:80%}
.mnode{pointer-events:auto;font-size:2.4vh;padding:1.2vh;border-radius:10px;text-align:left}
.mnode small{display:block;opacity:.7;font-size:1.7vh}.mnode.locked{opacity:.35;background:#222a;cursor:not-allowed}
.mnode.reached{background:#2a3b4acc}.mnode.current{background:#8a5a2acc;border-color:#ffd88a;box-shadow:0 0 12px #ffd88a}
#mapClose{pointer-events:auto;font-size:2.2vh;margin-top:1vh}
#locCard{position:absolute;top:30%;left:0;right:0;text-align:center;z-index:15;font-size:4vh;letter-spacing:.3em;color:#f4ecd8;background:linear-gradient(90deg,transparent,#000b,transparent);padding:2vh 0;transition:opacity .4s;pointer-events:none;opacity:0}
#reward,#endCard{position:absolute;inset:0;z-index:30;background:#000c;color:#f4ecd8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vh}
#reward.hidden,#endCard.hidden{display:none!important}#reward h2,#endCard h2{letter-spacing:.3em;margin:0}#endBody{max-width:40ch;line-height:1.7}
#dialogDim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:14;pointer-events:none}
#talkPortrait{position:absolute;right:2%;height:46%;z-index:16;pointer-events:none;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 16px #000a)}
#joystick{position:absolute;z-index:6;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid rgba(232,215,168,.55);touch-action:none;pointer-events:auto}
#joyKnob{position:absolute;width:42%;height:42%;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(244,236,216,.88);pointer-events:none}
#walkInteract{position:absolute;z-index:6;pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:0}
#walkInteract.hidden{display:none}
#zoneLabel{position:absolute;top:8vh;left:3%;z-index:5;pointer-events:none;color:#f4ecd8;background:#000a;padding:.6vh 1.6vh;border-radius:6px;font-size:2.2vh}
#zoneLabel small{display:block;opacity:.75;font-size:1.7vh}
#mapSub{font-size:1.8vh;letter-spacing:.14em;opacity:.8;margin-top:.6vh}
</style></head>
<body><div id="app"><div id="title" class="ui"><h1>《归迟录》</h1><button id="enter">开始游戏</button><button id="continue" class="hidden" style="margin-top:2vh">继续</button><button id="enterTown" style="margin-top:2vh">SC_03 可走桩</button></div>
<div id="hud" class="ui hud hidden"><div id="hudText">灰盒</div><div id="battleLog" class="hidden"></div><div class="row"><div id="interacts" class="row" style="margin:0"></div><button id="next" class="hidden">前往下一场景</button><button id="attack" class="hidden">攻击</button><button id="retreat" class="hidden">撤退（返回场景）</button><button id="dbgBattle">调试 · 战斗桩</button></div></div><button id="mapBtn" class="hidden">地图</button><div id="map" class="hidden"><h2 id="mapTitle">第一章</h2><div id="mapSub">非主路径 · 暂停总览</div><div id="mapObj"></div><div id="mapNodes"></div><button id="mapClose">关闭</button></div><div id="locCard"></div><div id="reward" class="hidden"><h2>获得</h2><div id="rewardBody"></div><button id="rewardOk">收好，进镇</button></div><div id="endCard" class="hidden"><h2 id="endTitle">第一章 · 未完</h2><div id="endBody"></div><div class="row"><button id="endClose">关闭</button><button id="endContinue">继续</button></div></div><div id="zoneLabel" class="hidden"><span id="zoneName">山门前</span><small id="zoneObj"></small></div><div id="joystick" class="hidden"><div id="joyKnob"></div></div><button id="walkInteract" class="hidden">调查</button><div id="dialogDim" class="hidden"></div><img id="talkPortrait" class="hidden" alt=""><div id="dialog" class="hidden"></div></div>
<script type="module" src="/src/main.ts"></script></body></html>
